<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #0f172a; }
      .card-bg { fill: #ffffff; stroke: #cbd5e1; rx: 8; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: bold; fill: #f8fafc; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #1e293b; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #64748b; }
      .pin-circle { fill: #ea580c; }
      .pin-text { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .badge-urgent { fill: #fee2e2; stroke: #fca5a5; rx: 4; }
      .badge-normal { fill: #eff6ff; stroke: #bfdbfe; rx: 4; }
      .badge-ask { fill: #fef3c7; stroke: #fde68a; rx: 4; }
      .btn-primary { fill: #2563eb; rx: 6; }
      .btn-outline { fill: #ffffff; stroke: #cbd5e1; rx: 6; }
      .btn-danger { fill: #ef4444; rx: 6; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" class="bg"/>

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="56" class="header-bg"/>
  <text x="24" y="34" class="text-title">EDU Study Mode · Bàn trực TA</text>
  <rect x="290" y="18" width="125" height="22" rx="11" fill="#3b82f6"/>
  <text x="352" y="33" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#fff" text-anchor="middle">TRACK 2 · NHÓM EDU</text>
  <rect x="425" y="18" width="225" height="22" rx="5" fill="#334155" stroke="#475569"/>
  <text x="537" y="33" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#93c5fd" text-anchor="middle">Lớp L3B · Bàn 5: Nhung · Đạt · Thành</text>

  <!-- Role Tabs (TA View Active) -->
  <rect x="740" y="14" width="230" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="800" y="33" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">🎓 Học viên (Đêm)</text>
  <rect x="855" y="16" width="113" height="26" rx="5" fill="#2563eb"/>
  <text x="912" y="33" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">👨‍🏫 Bàn trực TA (2)</text>

  <rect x="985" y="14" width="105" height="28" rx="5" fill="#334155" stroke="#475569"/>
  <text x="1037" y="32" font-family="sans-serif" font-size="11.5" fill="#f1f5f9" text-anchor="middle">⚙️ Cấu hình Live AI</text>

  <!-- Title Banner of TA View -->
  <rect x="30" y="75" width="1140" height="55" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="100" class="text-body" font-size="16" font-weight="bold">👨‍🏫 Bảng Điều Khiển Trợ Giảng (TA Management Queue) — Bonus Màn hình TA</text>
  <text x="50" y="118" class="text-muted">Quản lý câu hỏi chuyển trong ca trực đêm (08:00 – 22:00) và phê duyệt bài đăng FAQ lớp học. (Trợ giảng trực ca: Nguyễn Minh Thành - 2A202603884)</text>
  <rect x="980" y="87" width="170" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1065" y="107" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e40af" text-anchor="middle">Ca trực sáng mai: 08:00 – 12:00</text>

  <!-- 2 Big Cards Grid -->

  <!-- LEFT CARD: TICKETS QUEUE [6] -->
  <rect x="30" y="145" width="555" height="605" rx="10" class="card-bg"/>
  <circle cx="50" cy="170" r="10" class="pin-circle"/>
  <text x="50" y="170" class="pin-text">6</text>
  <text x="68" y="175" class="text-body" font-size="14.5" font-weight="bold">📥 Hàng chờ Câu hỏi chuyển đêm muộn (2 ticket đang mở)</text>
  <line x1="30" y1="195" x2="585" y2="195" stroke="#e2e8f0"/>

  <!-- TICKET 1: URGENT (CONTENT ISSUE §3.3) -->
  <rect x="50" y="210" width="515" height="235" rx="8" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="65" y="222" width="220" height="22" rx="4" class="badge-urgent"/>
  <text x="75" y="237" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">🔥 ƯU TIÊN CAO · NGHI VẤN TÀI LIỆU §3.3</text>
  <text x="460" y="237" class="text-muted">22:38 · 12/11/2026</text>

  <text x="65" y="262" class="text-body" font-weight="bold">Mã ticket: #TA-301 · Học viên: Võ Thị Phương Nhung (2A202603918)</text>
  <text x="65" y="282" class="text-body"><b>Nội dung thắc mắc:</b> "Em thấy mục §3.3 ghi 'Vì là căn bậc hai, độ lệch chuẩn luôn nhỏ</text>
  <text x="65" y="300" class="text-body">hơn phương sai', nhưng nếu phương sai = 0.25 thì căn ra 0.5 lớn hơn chứ ạ?"</text>

  <rect x="65" y="315" width="485" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="3"/>
  <text x="75" y="333" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">🤖 Phân tích AI tự động:</text>
  <text x="75" y="350" font-family="sans-serif" font-size="11.5" fill="#475569">• Học viên phản ánh chính xác mệnh đề toán học. Mệnh đề §3.3 sai với khoảng (0, 1).</text>
  <text x="75" y="367" font-family="sans-serif" font-size="11.5" fill="#475569">• AI đã tạm thời giữ vững nhận định đúng cho HV và đề xuất chuyển Giảng viên sửa giáo trình.</text>
  <text x="75" y="382" font-family="sans-serif" font-size="10.5" font-style="italic" fill="#dc2626">• RỦI RO NẾU TỰ ĐĂNG FAQ: Toàn bộ 65 học viên sẽ hoang mang nếu chưa có đính chính chính thức.</text>

  <rect x="65" y="402" width="210" height="30" rx="5" class="btn-primary"/>
  <text x="170" y="421" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Chuyển Giảng viên đính chính</text>

  <rect x="285" y="402" width="165" height="30" rx="5" class="btn-outline"/>
  <text x="367" y="421" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">Gửi phản hồi riêng cho HV</text>

  <!-- TICKET 2: NORMAL -->
  <rect x="50" y="460" width="515" height="135" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="65" y="472" width="130" height="22" rx="4" class="badge-normal"/>
  <text x="75" y="487" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">CÂU HỎI THƯỜNG</text>
  <text x="460" y="487" class="text-muted">22:42 · 12/11/2026</text>

  <text x="65" y="512" class="text-body" font-weight="bold">Mã ticket: #TA-302 · Học viên: Nguyễn Tiến Đạt (2A202603922)</text>
  <text x="65" y="532" class="text-body"><b>Nội dung:</b> "Em nhập dữ liệu lương nhân viên bị âm (-10 triệu), vậy trung vị tính sao ạ?"</text>

  <rect x="65" y="550" width="150" height="28" rx="5" class="btn-outline"/>
  <text x="140" y="568" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">Mở hội thoại xử lý</text>


  <!-- RIGHT CARD: FAQ APPROVAL WORKFLOW [7] -->
  <rect x="615" y="145" width="555" height="605" rx="10" class="card-bg"/>
  <circle cx="635" cy="170" r="10" class="pin-circle"/>
  <text x="635" y="170" class="pin-text">7</text>
  <text x="653" y="175" class="text-body" font-size="14.5" font-weight="bold">📢 Phê Duyệt Đăng FAQ Toàn Lớp (Tool duyet_dang_FAQ)</text>
  <line x1="615" y1="195" x2="1170" y2="195" stroke="#e2e8f0"/>

  <rect x="635" y="210" width="515" height="70" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="650" y="230" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">⚠️ QUY TẮC AN TOÀN SƯ PHẠM (COST-OF-ERROR BẢO VỆ LỚP HỌC):</text>
  <text x="650" y="248" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">• AI bị CẤM TUYỆT ĐỐI tự ý gọi `dang_FAQ` trực tiếp lên bảng tin cả lớp.</text>
  <text x="650" y="265" font-family="sans-serif" font-size="11.5" fill="#7f1d1d">• AI chỉ được phép gọi `soan_du_thao_FAQ` (lưu nháp nội bộ). TA phải bấm duyệt mới phát hành!</text>

  <!-- PENDING FAQ DRAFT -->
  <rect x="635" y="295" width="515" height="290" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="650" y="310" width="250" height="22" rx="4" class="badge-ask"/>
  <text x="660" y="325" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">BẢN THẢO AI SOẠN SẴN (CHỜ DUYỆT CỦA TA)</text>
  <text x="1055" y="325" class="text-muted">Đề xuất lúc: 22:40</text>

  <text x="650" y="352" class="text-body" font-size="13.5" font-weight="bold">Tiêu đề: Lưu ý đính chính về mối quan hệ giữa Phương sai &amp; Độ lệch chuẩn (§3.3)</text>
  
  <rect x="650" y="365" width="485" height="135" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="665" y="388" font-family="sans-serif" font-size="12" fill="#334155">"Chào cả lớp, tại mục §3.3 tài liệu Buổi 3 có nêu:</text>
  <text x="665" y="406" font-family="sans-serif" font-size="12" fill="#334155"><i>'Vì là căn bậc hai, độ lệch chuẩn luôn nhỏ hơn phương sai'</i>.</text>
  <text x="665" y="430" font-family="sans-serif" font-size="12" fill="#334155"><b>Xin lưu ý đính chính:</b> Quy tắc này chỉ đúng khi <b>phương sai > 1</b>.</text>
  <text x="665" y="450" font-family="sans-serif" font-size="12" fill="#334155">Với các tập dữ liệu có phương sai nằm trong khoảng (0, 1), ví dụ 0.25,</text>
  <text x="665" y="470" font-family="sans-serif" font-size="12" fill="#334155">thì độ lệch chuẩn là 0.5 (lớn hơn phương sai). Giảng viên sẽ thông báo chính thức!"</text>

  <!-- Action Buttons for FAQ approval -->
  <rect x="650" y="520" width="200" height="34" rx="6" fill="#15803d"/>
  <text x="750" y="542" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">✅ Duyệt phát hành toàn lớp</text>

  <rect x="860" y="520" width="135" height="34" rx="6" class="btn-outline"/>
  <text x="927" y="542" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">✏️ Chỉnh sửa nội dung</text>

  <rect x="1005" y="520" width="130" height="34" rx="6" class="btn-danger"/>
  <text x="1070" y="542" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">❌ Từ chối / Huỷ</text>

  <!-- Live Status Box -->
  <rect x="635" y="600" width="515" height="70" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="650" y="625" font-family="sans-serif" font-size="12" font-weight="bold" fill="#166534">🎉 LỢI ÍCH CỦA CƠ CHẾ HUMAN-IN-THE-LOOP:</text>
  <text x="650" y="645" font-family="sans-serif" font-size="11.5" fill="#15803d">• Tiết kiệm 90% thời gian soạn bài cho TA vào sáng hôm sau nhờ AI draft sẵn.</text>
  <text x="650" y="660" font-family="sans-serif" font-size="11.5" fill="#15803d">• Vẫn bảo toàn 100% độ chuẩn xác học thuật trước khi xuất bản ra toàn bộ 65 học viên.</text>

</svg>
