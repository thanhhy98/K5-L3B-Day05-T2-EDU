  <!-- AI Text Response -->
  <text x="320" y="285" class="text-body">Chào bạn, bạn có trực giác toán học rất sắc bén! Phản xạ của bạn hoàn toàn chính xác:</text>
  <text x="320" y="303" class="text-body">Khi phương sai nằm trong khoảng (0, 1) như <b>0.25</b>, thì căn bậc hai là <b>√0.25 = 0.5 > 0.25</b>.</text>
  <text x="320" y="325" class="text-body">Câu viết <i>"luôn nhỏ hơn phương sai"</i> trong giáo trình Buổi 3 (§3.3) là một điểm khái quát hoá</text>
  <text x="320" y="343" class="text-body">chưa chặt chẽ từ phía biên soạn. Mình đã gửi phản ánh đến Giảng viên để đính chính!</text>

