  <text x="395" y="185" font-family="sans-serif" font-size="12" fill="#fff">"Em thấy mục §3.3 ghi 'Vì là căn bậc hai, độ lệch chuẩn luôn nhỏ hơn phương sai',</text>
  <text x="395" y="202" font-family="sans-serif" font-size="12" fill="#fff">nhưng nếu phương sai là 0.25 thì căn ra 0.5 lớn hơn chứ ạ? Có phải tài liệu nhầm không?"</text>

